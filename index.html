<!DOCTYPE html>
<!-- 高考倒计时壁纸 v1.0.0 · gaokao-countdown · 基于 v4-se -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高考倒数日</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #8abde0;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 2vh 8vw 0 8vw;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .content {
            text-align: right;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .poem-block {
            width: 100%;
            transition: opacity 0.26s ease, transform 0.26s ease;
        }

        .poem-block.is-fading {
            opacity: 0;
            transform: translateY(0.6vh);
        }

        /* 诗词正文（字号由 JS 自适应） */
        .poem-line {
            font-size: 2vw;
            font-weight: 700;
            color: #2c5282;
            letter-spacing: 0.03em;
            line-height: 1.2;
            white-space: nowrap;
        }

        /* 9月9日 / 12月26日 纪念文字 */
        .poem-line.special {
            color: #1a3a5c;
            font-weight: 900;
            letter-spacing: 0.06em;
        }

        /* 出处 */
        .poem-source {
            font-size: 1.5vw;
            font-weight: 700;
            color: #2c5282;
            letter-spacing: 0.03em;
            margin-top: 0.4vh;
        }

        .poem-source .red {
            color: #ff0000;
        }

        /* 倒计时 */
        .line1 {
            font-size: 4.5vw;
            font-weight: 900;
            color: #1a3a5c;
            letter-spacing: 0.08em;
            line-height: 1.5;
            margin-top: 3vh;
        }

        .line2 {
            font-size: 4.5vw;
            font-weight: 900;
            color: #1a3a5c;
            letter-spacing: 0.08em;
            line-height: 1.5;
            margin-top: 0.5vh;
        }

        .red {
            color: #ff0000;
            font-weight: 900;
        }

        .days {
            font-size: 7vw;
            font-weight: 900;
        }

        .time-detail {
            font-size: 5vw;
            font-weight: 900;
            color: #1a3a5c;
            margin-top: 1vh;
            letter-spacing: 0.05em;
        }

        .time-number {
            color: #ff0000;
            font-weight: 900;
        }

        .target-info {
            margin-top: 2vh;
            font-size: 2vw;
            color: #2c5282;
            font-weight: 700;
        }

        @media (orientation: portrait) {
            .poem-line {
                font-size: 3vw;
            }
            .poem-source {
                font-size: 2vw;
            }
            .line1, .line2 {
                font-size: 5.5vw;
            }
            .days {
                font-size: 9vw;
            }
            .time-detail {
                font-size: 6vw;
            }
            .target-info {
                font-size: 3vw;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .poem-block {
                transition: none;
            }
        }

        /* ==================== 地球 ==================== */
        #globeLayer {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1.1s ease;
        }

        #globeLayer.dim {
            opacity: 0.32;
        }

        #globeLayer.hidden {
            opacity: 0;
        }

        #globe {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #globeStill {
            position: absolute;
            display: none;
            pointer-events: none;
        }

        #stillPin {
            position: absolute;
            display: none;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        #stillPin .dot {
            position: absolute;
            left: -6px;
            top: -6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f04438;
            border: 2px solid #fff;
            box-sizing: border-box;
            animation: pinPulse 2.2s ease-out infinite;
        }

        #stillPin .label {
            position: absolute;
            left: 20px;
            top: -22px;
            white-space: nowrap;
            color: #1a3a5c;
            font-weight: 700;
            font-size: clamp(13px, 1.2vw, 20px);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        #stillPin .label small {
            display: block;
            margin-top: 1px;
            font-size: 0.68em;
            font-weight: 600;
            opacity: 0.8;
        }

        @keyframes pinPulse {
            0% { box-shadow: 0 0 0 0 rgba(240, 68, 56, 0.45); }
            100% { box-shadow: 0 0 0 16px rgba(240, 68, 56, 0); }
        }

        body {
            touch-action: none;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        #globeToggle {
            display: inline-block;
            margin-top: 0.6vh;
            padding: 0.3vh 0.7vw;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.55);
            color: #1a3a5c;
            font-family: inherit;
            font-size: 1vw;      /* 比目标日期（2vw）略小 */
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 18px rgba(26, 58, 92, 0.12);
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease, background 0.2s ease;
        }

        #globeToggle.show {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        #globeToggle:active {
            background: rgba(255, 255, 255, 0.82);
        }

        @media (orientation: portrait) {
            #globeToggle {
                font-size: 1.5vw;
            }
            #stillPin .label {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="globeLayer" aria-hidden="true">
        <canvas id="globe"></canvas>
        <img id="globeStill" alt="">
        <div id="stillPin">
            <span class="dot"></span>
            <span class="label"><span id="stillName">虎山中学</span><small id="stillSub">广东省梅州市大埔县</small></span>
        </div>
    </div>

    <div class="content">
        <!-- 毛泽东诗词（诗词正文 + 出处） -->
        <div class="poem-block">
            <div class="poem-line" id="poemLine"></div>
            <div class="poem-source" id="poemSource"></div>
        </div>

        <!-- 倒计时 -->
        <div class="line1">距离<span class="red" id="examYear">2027</span>届高考仅剩</div>
        <div class="line2"><span class="red days" id="daysLeft">0</span>天</div>
        <div class="time-detail">
            <span class="time-number" id="hours">00</span>时
            <span class="time-number" id="minutes">00</span>分
            <span class="time-number" id="seconds">00</span>秒
        </div>
        <div class="target-info" id="targetDate"></div>
        <button id="globeToggle" type="button" aria-pressed="false">隐藏地球</button>
    </div>

    <script>
        // ==================== 倒计时 ====================
        function updateCountdown() {
            var now = new Date();
            var targetYear = 2027;
            var targetDate = new Date(targetYear, 5, 7, 9, 0, 0);

            while (targetDate <= now) {
                targetYear++;
                targetDate = new Date(targetYear, 5, 7, 9, 0, 0);
            }

            var diffTime = targetDate - now;
            var diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            var diffHours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var diffMinutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
            var diffSeconds = Math.floor((diffTime % (1000 * 60)) / 1000);

            document.getElementById('examYear').textContent = targetYear;
            document.getElementById('daysLeft').textContent = diffDays;
            document.getElementById('hours').textContent = String(diffHours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(diffMinutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(diffSeconds).padStart(2, '0');
            document.getElementById('targetDate').textContent = '目标日期：' + targetYear + '年06月07日 09:00';
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // ==================== 毛泽东诗词数据库 ====================
        // 文本参考《毛泽东诗词集》及天下韶山网、韶山毛泽东图书馆等公开资料整理。
        // 每首诗词的 v 数组按原作顺序排列，轮播时整首按顺序逐句显示。
        const poems = [
            {
                t: '五古·吟天井',
                v: [
                    '天井四四方，周围是高墙。',
                    '清清见卵石，小鱼囿中央。',
                    '只喝井里水，永远养不长。'
                ]
            },
            {
                t: '七绝·咏蛙',
                v: [
                    '独坐池塘如虎踞，绿杨树下养精神。',
                    '春来我不先开口，哪个虫儿敢作声？'
                ]
            },
            {
                t: '七绝·改诗赠父亲',
                v: [
                    '孩儿立志出乡关，学不成名誓不还。',
                    '埋骨何须桑梓地，人生无处不青山。'
                ]
            },
            {
                t: '四言诗·明耻篇题志',
                v: [
                    '五月七日，民国奇耻。',
                    '何以报仇？在我学子！'
                ]
            },
            {
                t: '五古·挽易昌陶',
                v: [
                    '去去思君深，思君君不来。',
                    '愁杀芳年友，悲叹有余哀。',
                    '衡阳雁声彻，湘滨春溜回。',
                    '感物念所欢，踯躅城南隈。',
                    '城隈草萋萋，涔泪浸双题。',
                    '采采余孤景，日落衡云西。',
                    '方期沆瀁游，零落匪所思。',
                    '永诀从今始，午夜惊鸣鸡。',
                    '鸣鸡一声唱，汗漫东皋上。',
                    '冉冉望君来，握手珠眶涨。',
                    '关山蹇骥足，飞飙拂灵帐。',
                    '我怀郁如焚，放歌倚列嶂。',
                    '列嶂青且蒨，愿言试长剑。',
                    '东海有岛夷，北山尽仇怨。',
                    '荡涤谁氏子，安得辞浮贱。',
                    '子期竟早亡，牙琴从此绝。',
                    '琴绝最伤情，朱华春不荣。',
                    '后来有千里，谁与共平生。',
                    '望灵荐杯酒，惨淡看铭旌。',
                    '惆怅中何寄？江天水一泓。'
                ]
            },
            {
                t: '五律·朱张渡',
                v: [
                    '共泛朱张渡，层冰涨橘汀。',
                    '鸟啼枫径寂，木落翠微冥。',
                    '攀险呼俦侣，盘空识健翎。',
                    '赫曦联韵在，千载德犹馨。'
                ]
            },
            {
                t: '七古·残句',
                v: [
                    '自信人生二百年，会当水击三千里。'
                ]
            },
            {
                t: '五言诗·残句（云封狮固楼）',
                v: [
                    '云封狮固楼，桥锁玉潭舟。'
                ]
            },
            {
                t: '七律·残篇（骤雨东风）',
                v: [
                    '骤雨东风过远湾，滂然遥接石龙关。',
                    '（原缺两句）',
                    '野渡苍松横古木，断桥流水动连环。',
                    '客行此去遵何路？坐眺长亭意转闲。'
                ]
            },
            {
                t: '七古·送纵宇一郎东行',
                v: [
                    '云开衡岳积阴止，天马凤凰春树里。',
                    '年少峥嵘屈贾才，山川奇气曾钟此。',
                    '君行吾为发浩歌，鲲鹏击浪从兹始。',
                    '洞庭湘水涨连天，艟艨巨舰直东指。',
                    '无端散出一天愁，幸被东风吹万里。',
                    '丈夫何事足萦怀，要将宇宙看稊米。',
                    '沧海横流安足虑，世事纷纭从君理。',
                    '管却自家身与心，胸中日月常新美。',
                    '名世于今五百年，诸公碌碌皆余子。',
                    '平浪宫前友谊多，崇明对马衣带水。',
                    '东瀛濯剑有书还，我返自崖君去矣。'
                ]
            },
            {
                t: '归国谣',
                v: [
                    '今宵月，直把天涯都照彻，清光不令青山失。',
                    '清溪却向青滩泄，鸡声歇，马嘶人语长亭白。'
                ]
            },
            {
                t: '五言诗·残句（苍山辞祖国）',
                v: [
                    '苍山辞祖国，弱水望邻封。'
                ]
            },
            {
                t: '虞美人·枕上',
                v: [
                    '堆来枕上愁何状？江海翻波浪。',
                    '夜长天色怎难明？无奈披衣起坐薄寒中。',
                    '晓来百念皆灰烬，倦极身无凭。',
                    '一钩残月向西流，对此不抛眼泪也无由。'
                ]
            },
            {
                t: '贺新郎·别友',
                v: [
                    '挥手从兹去。',
                    '更那堪凄然相向，苦情重诉。',
                    '眼角眉梢都似恨，热泪欲零还住。',
                    '知误会前番书语。',
                    '过眼滔滔云共雾，算人间知己吾和汝。',
                    '人有病，天知否？',
                    '今朝霜重东门路，照横塘半天残月，凄清如许。',
                    '汽笛一声肠已断，从此天涯孤旅。',
                    '凭割断愁丝恨缕。',
                    '要似昆仑崩绝壁，又恰像台风扫寰宇。',
                    '重比翼，和云翥。'
                ]
            },
            {
                t: '沁园春·长沙',
                v: [
                    '独立寒秋，湘江北去，橘子洲头。',
                    '看万山红遍，层林尽染；漫江碧透，百舸争流。',
                    '鹰击长空，鱼翔浅底，万类霜天竞自由。',
                    '怅寥廓，问苍茫大地，谁主沉浮？',
                    '携来百侣曾游。忆往昔峥嵘岁月稠。',
                    '恰同学少年，风华正茂；书生意气，挥斥方遒。',
                    '指点江山，激扬文字，粪土当年万户侯。',
                    '曾记否，到中流击水，浪遏飞舟？'
                ]
            },
            {
                t: '西江月·秋收起义',
                v: [
                    '军叫工农革命，旗号镰刀斧头。',
                    '匡庐一带不停留，要向潇湘直进。',
                    '地主重重压迫，农民个个同仇。',
                    '秋收时节暮云愁，霹雳一声暴动。'
                ]
            },
            {
                t: '菩萨蛮·黄鹤楼',
                v: [
                    '茫茫九派流中国，沉沉一线穿南北。',
                    '烟雨莽苍苍，龟蛇锁大江。',
                    '黄鹤知何去？剩有游人处。',
                    '把酒酹滔滔，心潮逐浪高！'
                ]
            },
            {
                t: '西江月·井冈山',
                v: [
                    '山下旌旗在望，山头鼓角相闻。',
                    '敌军围困万千重，我自岿然不动。',
                    '早已森严壁垒，更加众志成城。',
                    '黄洋界上炮声隆，报道敌军宵遁。'
                ]
            },
            {
                t: '清平乐·蒋桂战争',
                v: [
                    '风云突变，军阀重开战。',
                    '洒向人间都是怨，一枕黄粱再现。',
                    '红旗跃过汀江，直下龙岩上杭。',
                    '收拾金瓯一片，分田分地真忙。'
                ]
            },
            {
                t: '采桑子·重阳',
                v: [
                    '人生易老天难老，岁岁重阳。今又重阳，战地黄花分外香。',
                    '一年一度秋风劲，不似春光。胜似春光，寥廓江天万里霜。'
                ]
            },
            {
                t: '如梦令·元旦',
                v: [
                    '宁化、清流、归化，路隘林深苔滑。',
                    '今日向何方，直指武夷山下。',
                    '山下山下，风展红旗如画。'
                ]
            },
            {
                t: '减字木兰花·广昌路上',
                v: [
                    '漫天皆白，雪里行军情更迫。',
                    '头上高山，风卷红旗过大关。',
                    '此行何去？赣江风雪迷漫处。',
                    '命令昨颁，十万工农下吉安。'
                ]
            },
            {
                t: '蝶恋花·从汀州向长沙',
                v: [
                    '六月天兵征腐恶，万丈长缨要把鲲鹏缚。',
                    '赣水那边红一角，偏师借重黄公略。',
                    '百万工农齐踊跃，席卷江西直捣湘和鄂。',
                    '国际悲歌歌一曲，狂飙为我从天落。'
                ]
            },
            {
                t: '渔家傲·反第一次大“围剿”',
                v: [
                    '万木霜天红烂漫，天兵怒气冲霄汉。',
                    '雾满龙冈千嶂暗，齐声唤，前头捉了张辉瓒。',
                    '二十万军重入赣，风烟滚滚来天半。',
                    '唤起工农千百万，同心干，不周山下红旗乱。'
                ]
            },
            {
                t: '渔家傲·反第二次大“围剿”',
                v: [
                    '白云山头云欲立，白云山下呼声急，枯木朽株齐努力。',
                    '枪林逼，飞将军自重霄入。',
                    '七百里驱十五日，赣水苍茫闽山碧，横扫千军如卷席。',
                    '有人泣，为营步步嗟何及！'
                ]
            },
            {
                t: '菩萨蛮·大柏地',
                v: [
                    '赤橙黄绿青蓝紫，谁持彩练当空舞？',
                    '雨后复斜阳，关山阵阵苍。',
                    '当年鏖战急，弹洞前村壁。',
                    '装点此关山，今朝更好看。'
                ]
            },
            {
                t: '清平乐·会昌',
                v: [
                    '东方欲晓，莫道君行早。',
                    '踏遍青山人未老，风景这边独好。',
                    '会昌城外高峰，颠连直接东溟。',
                    '战士指看南粤，更加郁郁葱葱。'
                ]
            },
            {
                t: '十六字令三首',
                v: [
                    '山，快马加鞭未下鞍。',
                    '惊回首，离天三尺三。',
                    '山，倒海翻江卷巨澜。',
                    '奔腾急，万马战犹酣。',
                    '山，刺破青天锷未残。',
                    '天欲堕，赖以拄其间。'
                ]
            },
            {
                t: '忆秦娥·娄山关',
                v: [
                    '西风烈，长空雁叫霜晨月。',

        function getSpecialText(date) {

            const day = date.getDate();
            if (month === 9 && day === 9) {

            for (let i = arr.length - 1; i > 0; i--) {

                if (poemQueue.length > 1 && poemQueue[0] === lastPoemIndex) {

        function nextVerse() {

            if (newPoem) {

            const poem = poems[currentPoem.pi];
            const verse = poem.v[currentPoem.vi];
            currentPoem.vi++;
            if (currentPoem.vi >= poem.v.length) {

            return { verse: verse, title: poem.t, newPoem: newPoem };

        function renderPoem() {

            const wasSpecial = poemLine.classList.contains('special');
            let apply;
            let animate = true;
            if (special) {

                animate = item.newPoem || wasSpecial;   // 仅换诗（或离开纪念日）时做动画

            firstRender = false;
            swapPoemContent(apply, immediate || !animate);

        function schedulePoemChange() {
            if (poemTimer) clearTimeout(poemTimer);
            renderPoem();
            const delay = POEM_INTERVAL_MS - (Date.now() % POEM_INTERVAL_MS);
            poemTimer = setTimeout(schedulePoemChange, Math.max(delay, 1000));
        }

        schedulePoemChange();

        var t = now - t0;
        if (!introDone) {
            if (t < SPIN_MS) {
                yaw += (now - last) * 0.09;
                pitch = 8;
                scale = 1;
            } else {
                if (!zoomStarted) {
                    zoomStarted = true;
                    zoomFromYaw = yaw;
                    zoomFromPitch = pitch;
                    zoomDelta = angleDelta(yaw, TARGET_LON);
                }
                var k = Math.min(1, (t - SPIN_MS) / ZOOM_MS);
                var e = easeInOut(k);
                yaw = zoomFromYaw + zoomDelta * e;
                pitch = zoomFromPitch + (TARGET_LAT - zoomFromPitch) * e;
                scale = 1 + (TARGET_SCALE - 1) * e;
                if (k >= 1) {
                    introDone = true;
                    yaw = TARGET_LON;
                    pitch = TARGET_LAT;
                    scale = TARGET_SCALE;
                }
            }
        } else {
            if (!dragging && (Math.abs(velX) > 0.05 || Math.abs(velY) > 0.05)) {
                if (now - lastPointerUp < 550) {
                    var R = BASE_R * scale;
                    yaw -= velX / R * 57.3 * 0.35;
                    pitch += velY / R * 57.3 * 0.35;
                    pitch = Math.max(-80, Math.min(80, pitch));
                    velX *= 0.9;
                    velY *= 0.9;
                    if (Math.abs(velX) < 0.05) velX = 0;
                    if (Math.abs(velY) < 0.05) velY = 0;
                } else {
                    velX = 0;
                    velY = 0;
                }
            }
        }

        if (!dimmed && t >= DIM_MS) beginDim();
        last = now;

        if (!hidden) draw();

        if (mode === 'live' && !dragging && Math.abs(velX) < 0.05 && Math.abs(velY) < 0.05) {
            mode = 'frozen';
            stopLoop();
            return;
        }
        if (running) rafId = requestAnimationFrame(frame);
    }

    function beginDrag(e) {
        if (!introDone || hidden) return;
        if (e.target && e.target.closest && e.target.closest('#globeToggle')) return;

        userDragged = true;
        if (mode === 'still') {
            still.style.display = 'none';
            pin.style.display = 'none';
            canvas.style.display = 'block';
            mode = 'live';
            draw();
            startLoop();
        } else if (mode === 'frozen' || mode === 'intro') {
            mode = 'live';
            startLoop();
        }

        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        velX = 0;
        velY = 0;
    }

    function moveDrag(e) {
        if (!dragging) return;
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        var R = BASE_R * scale;
        yaw -= dx / R * 57.3;
        pitch += dy / R * 57.3;
        pitch = Math.max(-80, Math.min(80, pitch));
        velX = dx;
        velY = dy;
    }

    function endDrag() {
        dragging = false;
        lastPointerUp = performance.now();
    }

    toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        hidden = !hidden;
        layer.classList.toggle('hidden', hidden);
        if (hidden) {
            stopLoop();
        } else if (mode === 'live' || mode === 'intro') {
            startLoop();
        }
        toggle.textContent = hidden ? '显示地球' : '隐藏地球';
        toggle.setAttribute('aria-pressed', hidden ? 'true' : 'false');
    });

    window.addEventListener('pointerdown', beginDrag);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    window.addEventListener('resize', function () {
        resize();
        if (mode === 'frozen') draw();
    });
    window.addEventListener('orientationchange', function () {
        resize();
        if (mode === 'frozen') draw();
    });

    resize();
    t0 = performance.now();
    last = t0;
    startLoop();
})();

    </script>
</body>
</html>
